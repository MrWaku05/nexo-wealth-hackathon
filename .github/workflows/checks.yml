name: Validacion local del MVP
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Tests sin dependencias externas
        run: python -m unittest discover -s tests -v
      - name: Validar benchmark resumido
        run: python scripts/verify_benchmark.py --summary benchmark_summary.json
